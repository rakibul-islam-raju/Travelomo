upstream api_backend {
    server api:8000;
}

upstream nextjs_frontend {
    server web:3000;
}

server {
    listen 80;
    client_max_body_size 20M;

    # Django collected static files
    location /static/ {
        alias /staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Django media files (uploads)
    location /media/ {
        alias /mediafiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django API + Swagger docs
    location ~ ^/(api|swagger|redoc)/ {
        proxy_pass http://api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js frontend (everything else)
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js HMR not needed in prod, but keeps it safe)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
