version: "3.8"

services:

  # ─── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: travelomo_db
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - travelomo-db-data:/var/lib/postgresql/data
    networks:
      - travelomo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4.0-alpine
    container_name: travelomo_redis
    restart: always
    networks:
      - travelomo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Django API (Gunicorn) ───────────────────────────────────────────────────
  api:
    container_name: travelomo_api
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    command: >
      bash -c "python manage.py migrate
      && python manage.py collectstatic --noinput
      && python manage.py create_admin
      && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travelomo_network

  # ─── Celery Worker ───────────────────────────────────────────────────────────
  celery:
    container_name: travelomo_celery
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    command: celery -A core worker -l INFO
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - travelomo_network

  # ─── Celery Beat (Scheduler) ─────────────────────────────────────────────────
  celery-beat:
    container_name: travelomo_celery_beat
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    command: celery -A core beat -l INFO
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    networks:
      - travelomo_network

  # ─── Next.js Frontend ────────────────────────────────────────────────────────
  web:
    container_name: travelomo_web
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env.local
    restart: always
    networks:
      - travelomo_network

  # ─── Admin Panel (Vite → nginx) ──────────────────────────────────────────────
  web_admin:
    container_name: travelomo_web_admin
    build:
      context: ./admin
      dockerfile: Dockerfile
    env_file:
      - ./admin/.env
    restart: always
    ports:
      - "8383:80"
    networks:
      - travelomo_network

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: travelomo_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro
      - mediafiles:/mediafiles:ro
    depends_on:
      - api
      - web
    networks:
      - travelomo_network

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  travelomo_network:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  travelomo-db-data:
  staticfiles:
  mediafiles:
