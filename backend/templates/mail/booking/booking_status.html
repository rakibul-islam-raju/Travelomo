<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.6;">
    <div style="max-width: 600px; margin: 0 auto; padding: 24px;">
      <h2 style="margin-bottom: 8px;">Booking update</h2>
      <p>Hello {{ user_name }},</p>
      <p>{{ status_message }}</p>
      <div style="background: #f3f4f6; border-radius: 10px; padding: 16px; margin: 20px 0;">
        <p style="margin: 0;"><strong>Booking:</strong> {{ booking_reference }}</p>
        <p style="margin: 6px 0 0;"><strong>Event:</strong> {{ event_title }}</p>
        <p style="margin: 6px 0 0;"><strong>Status:</strong> {{ status_label }}</p>
      </div>
      <p>Open Travelomo to review the latest details.</p>
    </div>
  </body>
</html>
